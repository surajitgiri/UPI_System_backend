apiVersion: v1
kind: ConfigMap
metadata:
  name: upi-config
  namespace: upi-system
data:
  NODE_ENV: "production"
  # Service HTTP URLs (internal K8s DNS)
  ROUTING_SERVICE_URL: "http://routing-service:5020"
  NPCI_SWITCH_URL: "http://upi-switch:5010"
  TRANSACTION_SERVICE_URL: "http://transaction-service:5003"
  
  # Upstream gRPC Addresses (internal K8s DNS)
  ACCOUNT_GRPC_ADDRESS: "account-service:50052"
  CUSTOMER_GRPC_ADDRESS: "customer-service:50051"
  LEDGER_GRPC_ADDRESS: "ledger-service:50054"
  TRANSACTION_GRPC_ADDRESS: "transaction-service:50053"
  UPI_GRPC_ADDRESS: "upi-service:50056"
  PARTICIPANT_GRPC_ADDRESS: "routing-service:50061"
---
apiVersion: v1
kind: Secret
metadata:
  name: upi-secrets
  namespace: upi-system
type: Opaque
stringData:
  JWT_SECRET: 
  DATABASE_URL_ROUTING:
  DATABASE_URL_SWITCH: 
  DATABASE_URL_CUSTOMER: 
  DATABASE_URL_ACCOUNT: 
  DATABASE_URL_TRANSACTION:
  DATABASE_URL_LEDGER: 
  DATABASE_URL_UPI: 
