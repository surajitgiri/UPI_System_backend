# ─────────────────────────────────────────────────────────────────
# NodePort Gateway Service (Works on Minikube, Kind, Docker Desktop & Cloud)
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: upi-gateway-nodeport
  namespace: upi-system
spec:
  type: NodePort
  selector:
    app: upi-service
  ports:
    - name: upi-http
      port: 5006
      targetPort: 5006
      nodePort: 30006
---
apiVersion: v1
kind: Service
metadata:
  name: upi-switch-nodeport
  namespace: upi-system
spec:
  type: NodePort
  selector:
    app: upi-switch
  ports:
    - name: switch-http
      port: 5010
      targetPort: 5010
      nodePort: 30010
---
apiVersion: v1
kind: Service
metadata:
  name: bank-api-nodeport
  namespace: upi-system
spec:
  type: NodePort
  selector:
    app: bank-api
  ports:
    - name: bank-api-http
      port: 5005
      targetPort: 5005
      nodePort: 30005
---
# ─────────────────────────────────────────────────────────────────
# Standard Ingress (Optional: for NGINX / Cloud Ingress Controllers)
# ─────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upi-ingress
  namespace: upi-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          # Route /api/v1/upi/* to upi-service
          - path: /api/v1/upi(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: upi-service
                port:
                  number: 5006
          # Route /api/v1/switch/* to upi-switch
          - path: /api/v1/switch(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: upi-switch
                port:
                  number: 5010
          # Route /api/v1/bank/* to bank-api
          - path: /api/v1/bank(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bank-api
                port:
                  number: 5005
