# ─────────────────────────────────────────────────────────────────
# UPI Service
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upi-service
  namespace: upi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upi-service
  template:
    metadata:
      labels:
        app: upi-service
    spec:
      containers:
        - name: upi-service
          image: upi/upi-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5006
            - name: grpc
              containerPort: 50056
          env:
            - name: PORT
              value: "5006"
            - name: GRPC_PORT
              value: "50056"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: upi-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: upi-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: upi-secrets
                  key: DATABASE_URL_UPI
            - name: ACCOUNT_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: upi-config
                  key: ACCOUNT_GRPC_ADDRESS
            - name: CUSTOMER_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: upi-config
                  key: CUSTOMER_GRPC_ADDRESS
            - name: ROUTING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: upi-config
                  key: ROUTING_SERVICE_URL
            - name: NPCI_SWITCH_URL
              valueFrom:
                configMapKeyRef:
                  name: upi-config
                  key: NPCI_SWITCH_URL
            - name: TRANSACTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: upi-config
                  key: TRANSACTION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: upi-service
  namespace: upi-system
spec:
  selector:
    app: upi-service
  ports:
    - name: http
      port: 5006
      targetPort: 5006
    - name: grpc
      port: 50056
      targetPort: 50056

