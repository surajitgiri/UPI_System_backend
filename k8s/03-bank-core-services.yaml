# ─────────────────────────────────────────────────────────────────
# Customer Service
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: upi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: upi/customer-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
            - name: grpc
              containerPort: 50051
          env:
            - name: PORT
              value: "5001"
            - name: GRPC_PORT
              value: "50051"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: upi-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: upi-secrets
                  key: DATABASE_URL_CUSTOMER
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: upi-system
spec:
  selector:
    app: customer-service
  ports:
    - name: http
      port: 5001
      targetPort: 5001
    - name: grpc
      port: 50051
      targetPort: 50051

